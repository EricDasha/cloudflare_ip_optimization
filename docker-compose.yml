services:
  cloudflare-tools:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/cloudflare-tools:latest
    pull_policy: build
    container_name: cloudflare-tools
    restart: unless-stopped
    ports:
      - "8080:8080"   # Web 控制台
      - "1234:1234"   # CFnat 本地转发入口
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      WEB_ADDR: 0.0.0.0:8080

      # 与 cmliu/CFnat-Docker 思路一致：用环境变量生成 cfnat 运行参数；Web 页面也可覆盖后重启。
      CFNAT_AUTO_START: "true"
      CFNAT_ADDR: 0.0.0.0:1234
      CFNAT_COLO: ""                 # 例如 HKG,SJC,LAX；留空则不过滤
      CFNAT_DELAY: "2000"
      CFNAT_DOMAIN: cloudflaremirrors.com/debian
      CFNAT_FIXED_IPS: "23.146.248.149,207.57.131.117,104.18.40.152,104.18.42.163"
      # 注意：CFNAT_FIXED_IPS 只是「首次启动、池文件尚不存在」时的种子值。
      # 一旦 proxy-active.json 存在，Web 会用池文件覆盖它（web/pool.go:187
      # cfnatCfg.Fixed = strings.Join(fixedMembers, ",")），此处的值不再生效。
      # 2026-10-23 实测：线上 4 个 IP 全部 TLS 握手成功（含 10-22 曾被 SNI
      # 阻断的 104.18.40.152 / 104.18.42.163），故保留全部 4 个作冷启动种子。
      CFNAT_FALLBACK: "${CFNAT_FALLBACK:-}"      # 兜底目标（IP 或优选域名），仅拨号失败时尝试
      CFNAT_PRIORITY_IPS: ""
      CFNAT_IPNUM: "20"
      CFNAT_IPS: "4"                 # 4 或 6
      CFNAT_NUM: "${CFNAT_NUM:-3}"   # 拨号失败后的顺序回退深度（不是并发数）
      CFNAT_PORT: "443"
      CFNAT_RANDOM: "true"
      CFNAT_STICKY: "${CFNAT_STICKY:-true}"   # true=一台设备钉一个出口（设备间错开）；false=按连接轮转铺开全部成员
      # 2026-11-06 改默认 true。原默认 false 的后果是「同一台设备每条连接都换出口」：
      # 视频会断流、Cookie 会话来回漂，看起来就是「负载均衡没生效」。粘性的正确
      # 语义是「设备之间分散、设备自己稳定」，cfnat 的钉位表按到达顺序分配，
      # 出口数 ≥ 设备数时每台设备独占一个，不再靠哈希碰运气。
      CFNAT_TASK: "100"
      CFNAT_TLS: "true"
      CFNAT_CODE: "200"

      # 每 6 小时以实际 Host + WebSocket path 终审候选；至少 3 个通过才替换固定池。
      # 生产实况（2026-10-23）：线上为 true —— 运营商掐断 CF 段期间，池子靠
      # 自动换池自愈（10-22 13:04 与 10-23 09:28 各重建一次）。默认改 true，
      # 让「从本仓库部署」与「线上行为」一致；不想自动换池就显式设 false。
      PROXY_AUTO_APPLY: "${PROXY_AUTO_APPLY:-true}"
      PROXY_AUTO_HOST: "${PROXY_AUTO_HOST:?set PROXY_AUTO_HOST in .env}"
      PROXY_AUTO_PATH: "${PROXY_AUTO_PATH:?set PROXY_AUTO_PATH in .env}"
      PROXY_AUTO_PORT: "443"
      PROXY_AUTO_CONCURRENCY: "20"
      PROXY_AUTO_MAX_LATENCY: "5000"
      # 可被 .env 覆盖的生效池大小（默认 5）。2026-10-23 发现 NAS .env 里的
      # PROXY_AUTO_POOL_SIZE=10 因此处原为硬编码而被静默忽略，故改为可注入。
      PROXY_AUTO_POOL_SIZE: "${PROXY_AUTO_POOL_SIZE:-5}"
      PROXY_AUTO_MIN_POOL: "3"
      # 优选域名直连：显式指定后并入 CFnat 固定转发池；IP 池结果仍来自 VLESS 终审。
      PROXY_DOMAIN_FORWARD: "${PROXY_DOMAIN_FORWARD:-}"
      # 优选域名兜底转发：置 true 时把已启用的优选域名并入 cfnat -fallback
      # （上限 12 个），仅在固定 IP 池全部拨号失败时才直连域名，不解析不探测。
      PROXY_AUTO_DOMAINS: "true"
      # 优选域名入池上限（代码常量 maxForwardDomains=30，此处仅可下调）。
      PROXY_PREFERRED_MAX_DOMAINS: "20"
      # 已停用、不再被代码读取（保留会误导运维，此处显式留空记录）：
      #   PROXY_PREFERRED_RESOLVE / PROXY_PREFERRED_IPS_PER_DOMAIN /
      #   PROXY_PREFERRED_RESOLVED_CANDIDATES  —— C 区解析供给已拆，域名活解析直连
      #   PROXY_CFDATA_CANDIDATES                  —— 已废弃；cfdata 走 result.csv 供给层
      #   PROXY_OFFICIAL_CANDIDATES                —— 官方 CIDR 层已砍
      PROXY_USER_CANDIDATES: "${PROXY_USER_CANDIDATES:-}"
      # 低占用后台轮测：每 5 分钟取 12 个候选，并发 4；GUI 可关闭并持久化。
      PROXY_BACKGROUND_OPTIMIZER: "true"
      # 质量调度器：候选分批探测，Active 仅轻量探活；Promotion/Failover 由状态机决定
      PROXY_SCHEDULER_PROBE_INTERVAL_SECONDS: "300"
      PROXY_SCHEDULER_BATCH_SIZE: "12"
      PROXY_SCHEDULER_APPLY: "true"
      # CFdata 供给层：启动即后台自扫一次，此后每 6 小时一轮（CFDATA_AUTO_SCAN
      # 默认开启，置 false 退回纯手动 /api/cfdata/run）。结果写 result.csv，
      # 只要求公网 IPv4，直接汇入候选池（第二大供给层；2026-11-05 起不再过
      # CF 官方段闸，见 README「官方段降级为标签」）。
      # 日常 IP 供给另有订阅采集/考试：PROXY_SUBSCRIPTION_*。
      # 订阅日常慢入池：维护者域名清单 + 转换器基地址 + token（token 从 .env 注入）。
      # 这里的 MAINTAINERS 只是「首次启动的种子」：之后维护者清单以页面上编辑的
      # data/proxy-subscriptions.json 为准，改这里不会覆盖页面上的增删。
      PROXY_SUBSCRIPTION_CONVERTER: "https://vlesdy.trojanjd.dpdns.org/sub"
      PROXY_SUBSCRIPTION_MAINTAINERS: "owo.o00o.ooo,cm.soso.edu.kg,zrf.zrf.me,sub.keaeye.icu,sub.mot.cloudns.biz,sub.mia.xx.kg,sub.lzjbaby.com,sub.xdu.qzz.io"
      PROXY_SUBSCRIPTION_TOKEN: "${PROXY_SUBSCRIPTION_TOKEN:-}"
      PROXY_SUBSCRIPTION_REFRESH_ENABLED: "true"
      # 收与考分开两条节奏：
      #   收（harvest）= 拉订阅、提取、记账。跟着维护者上游走，6 小时一轮足够。
      #   考（probe）  = 从本子里挑候选做真实考试。只受本机预算约束，跑得勤。
      # 旧实现把两者绑成一个周期，于是采集量被考试预算卡死：收得再多也只能考
      # 那么点，剩下的当场丢弃且不留记录。拆开后本子里有全量候选可查可复盘。
      PROXY_SUBSCRIPTION_REFRESH_MINUTES: "360"
      PROXY_SUBSCRIPTION_PROBE_MINUTES: "10"
      PROXY_SUBSCRIPTION_PROBE_BATCH: "400"
      PROXY_SUBSCRIPTION_RECHECK_MINUTES: "360"
      PROXY_SUBSCRIPTION_RETRY_MINUTES: "120"
      PROXY_SUBSCRIPTION_PER_MAINTAINER: "30"
      PROXY_SUBSCRIPTION_FETCH_TIMEOUT: "45"
      # WS 101 粗筛的时间预算（便宜，并发 4）。这一层只剔「门都敲不开」的。
      PROXY_SUBSCRIPTION_VERIFY_TIMEOUT: "240"
      # sing-box 真实数据面（贵，每条约 12 秒，并发 2）。这才是裁判。
      # 模板未配置时自动降级为「仅握手级结论」，并在页面异常栏写明原因。
      PROXY_SUBSCRIPTION_VLESS_TIMEOUT: "12"
      PROXY_SUBSCRIPTION_VLESS_MAX: "120"
      PROXY_SUBSCRIPTION_VLESS_CONCURRENCY: "2"
      PROXY_SUBSCRIPTION_VLESS_BUDGET: "900"
      # 换池防抖：自动换池全局冷却 +生效池健康窗口。
      PROXY_POOL_SWITCH_COOLDOWN_MINUTES: "30"
      PROXY_ACTIVE_HEALTH_WINDOW_MINUTES: "60"
      # 机房软偏好（可选）：候选充裕时只取偏好机房、匮乏时其余补位（只重排不拒收）。
      # 移动/广电常 HKG，电信/联通常 SJC/LAX——以实测为准；留空禁用。
      PROXY_POOL_COLO_PREFER: "${PROXY_POOL_COLO_PREFER:-}"

      # 优选域名体检：TCP:443 快检 + 短时真实下载，产出「速度 / 成功率 / 抖动」
      # 三本账，只读不动池。
      #
      # 间隔默认 30 分钟（代码下限 5 分钟）：单轮 12 域名 × 256 KiB ≈ 3 MiB，
      # 半小时一轮约 144 MiB/天。稳定性靠多轮历史，不靠高频——把家宽烧在体检上
      # 并不划算。此处若设成 300（5 分钟），流量立刻涨到约 860 MiB/天。
      PROXY_DOMAIN_PROBE_ENABLED: "${PROXY_DOMAIN_PROBE_ENABLED:-true}"
      PROXY_DOMAIN_PROBE_INTERVAL_SECONDS: "1800"
      PROXY_DOMAIN_PROBE_TIMEOUT_MS: "3000"
      # 下载端点必须是「非 Cloudflare 目标」：2026-10-20 实测这条
      # Worker+ProxyIP 链路对 gstatic/generate_204（非 CF）0.54s 即通，对
      # speed.cloudflare.com / cp.cloudflare.com（CF 目标）20~60s 零字节。
      # 端点若落在 CF 上，每轮全都超时，账本会静默变成一堆 0。
      PROXY_DOMAIN_SPEED_URL: "${PROXY_DOMAIN_SPEED_URL:-https://proof.ovh.net/files/10Mb.dat}"
      # 只读到这么多字节即止（文件本身 10 MB，靠 io.LimitReader 截断）。
      PROXY_DOMAIN_SPEED_BYTES: "262144"
      PROXY_DOMAIN_SPEED_TIMEOUT_SECONDS: "20"

      # WS 101 通过后，使用 /data 中的本地 VLESS outbound 模板做真实数据面终审。
      PROXY_VLESS_PROBE: "true"
      PROXY_VLESS_TEMPLATE: /data/vless-probe-outbound.json
      PROXY_VLESS_TEST_URL: https://www.gstatic.com/generate_204
      PROXY_VLESS_EXPECT_STATUS: "204"
      PROXY_VLESS_TIMEOUT: "15"
      PROXY_VLESS_MAX_CANDIDATES: "20"
      # 测速为软门槛：只影响排序与展示，不再否决已通过 204 的候选。
      # 注意：PROXY_VLESS_SPEED_URL 未设时默认落在 speed.cloudflare.com，
      # 与上面域名测速踩的是同一个坑（链路到不了 CF 目标）。故 IP 侧吞吐
      # 排序目前恒为空、形同虚设。改法是把它也指向非 CF 定长文件——这会
      # 改变优选排序、进而影响换池，属独立决策，需明示后再动。
      # 关闭成员体检不共享这个坑：它有自己的 PROXY_DISABLED_BENCH_SPEED_URL，
      # 默认已指向非 CF 的 OVH 定长文件。
      PROXY_VLESS_SPEED_BYTES: "2097152"
      PROXY_VLESS_SPEED_TIMEOUT: "20"
      PROXY_VLESS_MIN_DOWNLOAD_MBPS: "3"
      SING_BOX_BIN: /usr/local/bin/sing-box
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/cloudflare-web", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
