services:
  cloudflare-tools:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/cloudflare-tools:latest
    pull_policy: build
    container_name: cloudflare-tools
    restart: unless-stopped
    ports:
      - "8080:8080"   # Web 控制台
      - "1234:1234"   # CFnat 本地转发入口
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      WEB_ADDR: 0.0.0.0:8080

      # 与 cmliu/CFnat-Docker 思路一致：用环境变量生成 cfnat 运行参数；Web 页面也可覆盖后重启。
      CFNAT_AUTO_START: "true"
      CFNAT_ADDR: 0.0.0.0:1234
      CFNAT_COLO: ""                 # 例如 HKG,SJC,LAX；留空则不过滤
      CFNAT_DELAY: "2000"
      CFNAT_DOMAIN: cloudflaremirrors.com/debian
      CFNAT_FIXED_IPS: 128.199.255.242,119.205.235.58,60.249.21.30
      CFNAT_FALLBACK: "${CFNAT_FALLBACK:-}"      # 兜底目标（IP 或优选域名），仅拨号失败时尝试
      CFNAT_PRIORITY_IPS: ""
      CFNAT_IPNUM: "20"
      CFNAT_IPS: "4"                 # 4 或 6
      CFNAT_NUM: "1"
      CFNAT_PORT: "443"
      CFNAT_RANDOM: "true"
      CFNAT_TASK: "100"
      CFNAT_TLS: "true"
      CFNAT_CODE: "200"

      # 每 6 小时以实际 Host + WebSocket path 终审候选；至少 3 个通过才替换固定池。
      PROXY_AUTO_APPLY: "true"
      PROXY_AUTO_HOST: "${PROXY_AUTO_HOST:?set PROXY_AUTO_HOST in .env}"
      PROXY_AUTO_PATH: "${PROXY_AUTO_PATH:?set PROXY_AUTO_PATH in .env}"
      PROXY_AUTO_PORT: "443"
      PROXY_AUTO_CONCURRENCY: "20"
      PROXY_AUTO_MAX_LATENCY: "5000"
      PROXY_AUTO_POOL_SIZE: "5"
      PROXY_AUTO_MIN_POOL: "3"
      PROXY_AUTO_CFDATA: "false"
      PROXY_AUTO_CFDATA_TIMEOUT: "600"
      # 优选域名直连：显式指定后并入 CFnat 固定转发池；IP 池结果仍来自 VLESS 终审。
      PROXY_DOMAIN_FORWARD: "${PROXY_DOMAIN_FORWARD:-}"
      # 优选域名兜底转发：置 true 时把已启用的优选域名并入 cfnat -fallback
      # （上限 12 个），仅在固定 IP 池全部拨号失败时才直连域名，不解析不探测。
      PROXY_AUTO_DOMAINS: "true"
      # 优选域名按延迟排序后仅取前 N 个合入候选池，避免过度依赖优选域名。
      PROXY_PREFERRED_MAX_DOMAINS: "20"
      PROXY_CFDATA_CANDIDATES: "300"
      PROXY_OFFICIAL_CANDIDATES: "150"
      PROXY_USER_CANDIDATES: "${PROXY_USER_CANDIDATES:-}"
      # 低占用后台轮测：每 15 分钟取 24 个候选，并发 4；GUI 可关闭并持久化。
      PROXY_BACKGROUND_OPTIMIZER: "true"
      # 质量调度器：候选分批探测，Active 仅轻量探活；Promotion/Failover 由状态机决定
      PROXY_SCHEDULER_PROBE_INTERVAL_SECONDS: "300"
      PROXY_SCHEDULER_BATCH_SIZE: "12"
      PROXY_SCHEDULER_APPLY: "true"
      # CFdata 彻底手动化：无后台自启动、无定时扫描、无 sift 联动。
      # 以下变量保留仅防旧配置残留，服务端不再读取。
      # 日常 IP 供给走订阅慢扫：PROXY_SUBSCRIPTION_*。
      PROXY_CFDATA_BACKGROUND_ENABLED: "false"
      PROXY_CFDATA_BACKGROUND_MINUTES: "60"
      PROXY_CFDATA_BACKGROUND_TIMEOUT: "600"
      PROXY_CFDATA_SIFT_COUNT: "40"
      # 订阅日常慢入池：维护者域名清单 + 转换器基地址 + token（token 从 .env 注入）。
      PROXY_SUBSCRIPTION_CONVERTER: "https://vlesdy.trojanjd.dpdns.org/sub"
      PROXY_SUBSCRIPTION_MAINTAINERS: "owo.o00o.ooo,cm.soso.edu.kg,zrf.zrf.me,sub.keaeye.icu,sub.mot.cloudns.biz,sub.mia.xx.kg,sub.lzjbaby.com,sub.xdu.qzz.io"
      PROXY_SUBSCRIPTION_TOKEN: "${PROXY_SUBSCRIPTION_TOKEN:-}"
      PROXY_SUBSCRIPTION_REFRESH_ENABLED: "true"
      PROXY_SUBSCRIPTION_REFRESH_MINUTES: "360"
      PROXY_SUBSCRIPTION_PER_MAINTAINER: "30"
      PROXY_SUBSCRIPTION_FETCH_TIMEOUT: "45"
      PROXY_SUBSCRIPTION_VERIFY_TIMEOUT: "240"
      # 换池防抖：自动换池全局冷却 +生效池健康窗口。
      PROXY_POOL_SWITCH_COOLDOWN_MINUTES: "30"
      PROXY_ACTIVE_HEALTH_WINDOW_MINUTES: "60"

      # WS 101 通过后，使用 /data 中的本地 VLESS outbound 模板做真实数据面终审。
      PROXY_VLESS_PROBE: "true"
      PROXY_VLESS_TEMPLATE: /data/vless-probe-outbound.json
      PROXY_VLESS_TEST_URL: https://www.gstatic.com/generate_204
      PROXY_VLESS_EXPECT_STATUS: "204"
      PROXY_VLESS_TIMEOUT: "15"
      PROXY_VLESS_MAX_CANDIDATES: "20"
      # 测速为软门槛：只影响排序与展示，不再否决已通过 204 的候选。
      PROXY_VLESS_SPEED_BYTES: "2097152"
      PROXY_VLESS_SPEED_TIMEOUT: "20"
      PROXY_VLESS_MIN_DOWNLOAD_MBPS: "3"
      SING_BOX_BIN: /usr/local/bin/sing-box
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/cloudflare-web", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
