name: ci

# 覆盖范围说明
# ------------
# 1. 本仓库只有一个 Go 包 local/cloudflare-tools/web，因此 `go test ./...` 就是全部单测。
# 2. cfnat.go / cfdata.go 带 `//go:build ignore`（独立的 main 包，按文件单独构建），
#    `./...` 不会带上它们，所以 build job 额外单独构建这两个。
# 3. race 单独成 job：它慢 3~10 倍，失败语义也不同（数据竞争 vs 断言失败），
#    混在一起会让「测试挂了」失去区分度。
# 4. `pr-baseline` job 用矩阵分别 checkout 两个 PR 的 head 来跑测试：
#    PR2 依赖 PR1（base 是 handoff/20261112），不能当成独立分支测；
#    所以这里显式测「PR1 head 自身」与「PR2 head 自身」两个真实代码状态，
#    其余 job 测的是当前分支（= PR2 + 本分支的夹具修复）。

on:
  push:
    branches:
      - "ci/**"
      - "handoff/**"
      - "audit/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -trimpath

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go env
        run: go version && go env GOOS GOARCH CGO_ENABLED
      - name: go test ./...
        run: go test ./... -count=1

  race:
    name: go test -race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race ./...
        run: go test -race ./... -count=1

  vet:
    name: go vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet ./...
        run: go vet ./...

  build:
    name: linux build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build cloudflare-web
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags "-s -w -X main.gitCommit=${GITHUB_SHA} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o /tmp/dist/cloudflare-web ./web
      - name: build cfnat
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags "-s -w" -o /tmp/dist/cfnat cfnat.go
      - name: build cfdata
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags "-s -w" -o /tmp/dist/cfdata cfdata.go
      - name: verify artifacts
        run: |
          ls -l /tmp/dist
          file /tmp/dist/cloudflare-web /tmp/dist/cfnat /tmp/dist/cfdata

  # pr-baseline 是「特征化断言」，不是「放水」：
  #
  # 它 checkout 两个 PR 的**原始 head**（不含本分支的夹具修复），跑全套测试，
  # 然后断言「失败集合恰好等于已知那一项」。已知失败是
  # `TestAllowedFileWhitelistUnchanged / path traversal must be denied`：
  # 原始 head 的 fileserver_test.go 把分隔符写死成反斜杠（`..\ip.csv`），
  # Linux 上它只是个含反斜杠的普通文件名，按 .csv 放行即可，于是断言失败。
  #
  # 判定规则：
  #   * 失败集合 == 已知集合  → 通过，并注明「已知失败，无新增」
  #   * 失败集合 ⊃  已知集合  → **失败**（原始 head 上出现了新问题）
  #   * 失败集合 ⊂  已知集合  → **失败**（基线漂了，说明这个 job 已失去意义，
  #                              或有人偷偷改了 raw head，需要人看一眼）
  #
  # 因此它既不会掩盖测试失败，也不会因为一个已知的、本分支已修的夹具 bug
  # 把整个 CI 长期染红。夹具合入 PR1/PR2 后，预期集合要同步清空。
  pr-baseline:
    name: pr head raw / ${{ matrix.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        ref:
          - handoff/20261112
          - audit/round2-20261112
        include:
          - ref: handoff/20261112
            expected: TestAllowedFileWhitelistUnchanged
          - ref: audit/round2-20261112
            expected: TestAllowedFileWhitelistUnchanged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet ./...
        run: go vet ./...
      - name: go test ./... (count=1)
        id: rawtest
        run: |
          set +e
          go test ./... -count=1 -v > test.txt 2>&1
          rc=$?
          set -e
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          # 失败不算本 step 失败：真正的判定在下一步做集合比较。
          echo "raw head exit code: $rc"
      - name: assert failure set matches the known baseline
        env:
          EXPECTED: ${{ matrix.expected }}
        run: |
          # 从 -v 输出里抽所有 --- FAIL: 行，取测试名，排序去重。
          grep -E '^--- FAIL: ' test.txt | awk '{print $3}' | sed 's/(.*//' | sort -u > actual.txt || true
          sort -u <<<"$EXPECTED" > expected.txt

          echo "## 原始 head 基线：${{ matrix.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '预期失败（已知，本分支已修）：' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat expected.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '实测失败：' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat actual.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # 关键断言：两个集合必须逐字相同。
          if ! diff -u expected.txt actual.txt > baseline.diff; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '**基线不匹配**：' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat baseline.diff >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "基线不匹配，见 diff："
            cat baseline.diff
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "结论：失败集合与已知基线完全一致，无新增失败。" >> "$GITHUB_STEP_SUMMARY"
          echo "这些失败由本分支的夹具修复合入 PR1/PR2 后消除；届时请同步清空 expected。" >> "$GITHUB_STEP_SUMMARY"

          grep -E '^(--- FAIL|FAIL|ok |panic)' test.txt | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-${{ strategy.job-index }}
          path: |
            test.txt
            actual.txt
            expected.txt
            baseline.diff
