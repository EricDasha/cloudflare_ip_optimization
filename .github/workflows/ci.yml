name: ci

# 覆盖范围说明
# ------------
# 1. 本仓库只有一个 Go 包 local/cloudflare-tools/web，因此 `go test ./...` 就是全部单测。
# 2. cfnat.go / cfdata.go 带 `//go:build ignore`（独立的 main 包，按文件单独构建），
#    `./...` 不会带上它们，所以 build job 额外单独构建这两个。
# 3. race 单独成 job：它慢 3~10 倍，失败语义也不同（数据竞争 vs 断言失败），
#    混在一起会让「测试挂了」失去区分度。
# 4. `pr-baseline` job 用矩阵分别 checkout 两个 PR 的 head 来跑测试：
#    PR2 依赖 PR1（base 是 handoff/20261112），不能当成独立分支测；
#    所以这里显式测「PR1 head 自身」与「PR2 head 自身」两个真实代码状态，
#    其余 job 测的是当前分支（= PR2 + 本分支的夹具修复）。

on:
  push:
    branches:
      - "ci/**"
      - "handoff/**"
      - "audit/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -trimpath

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go env
        run: go version && go env GOOS GOARCH CGO_ENABLED
      - name: go test ./...
        run: go test ./... -count=1

  race:
    name: go test -race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race ./...
        run: go test -race ./... -count=1

  vet:
    name: go vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet ./...
        run: go vet ./...

  build:
    name: linux build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build cloudflare-web
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags "-s -w -X main.gitCommit=${GITHUB_SHA} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o /tmp/dist/cloudflare-web ./web
      - name: build cfnat
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags "-s -w" -o /tmp/dist/cfnat cfnat.go
      - name: build cfdata
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags "-s -w" -o /tmp/dist/cfdata cfdata.go
      - name: verify artifacts
        run: |
          ls -l /tmp/dist
          file /tmp/dist/cloudflare-web /tmp/dist/cfnat /tmp/dist/cfdata

  # pr-baseline 测的是两个 PR **原始 head** 的代码，不含本分支的夹具修复。
  # 已知它会红，而且应该红：PR1 / PR2 的 fileserver_test.go 把路径分隔符
  # 写死成 Windows 反斜杠（`..\ip.csv`），在 Linux 上只是一个含反斜杠的
  # 普通文件名，按 .csv 放行，于是 `path traversal must be denied` 失败。
  #
  # 注意：GitHub 会忽略 job 级 continue-on-error 对 run 结论的影响（实测
  # run 仍记 failure），所以这里不用它，改成「把原始输出当交付物」：
  # 完整日志落 artifact + 摘要写进 step summary，job 本身如实转述结果。
  # 这不是屏蔽测试——本分支自己的工作树跑的是真测试，红就是红。
  pr-baseline:
    name: pr head raw / ${{ matrix.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        ref:
          - handoff/20261112
          - audit/round2-20261112
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet ./...
        run: go vet ./... 2>&1 | tee vet.txt
      - name: go test ./... (count=1)
        id: rawtest
        run: |
          set +e
          go test ./... -count=1 -v 2>&1 | tee test.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: summarize
        run: |
          {
            echo "## 原始 head 测试快照：${{ matrix.ref }}"
            echo ""
            echo '```'
            grep -E '^(--- FAIL|FAIL|ok |panic)' test.txt | head -40
            echo '```'
            echo ""
            if [ "${{ steps.rawtest.outputs.exit }}" != "0" ]; then
              echo "结论：该 head 在 Linux 上测试未通过（见上）。"
              echo "这是修复前的真实状态，用于给夹具修复提供对照基线；"
              echo "合入本分支的夹具修复后应当转绿。"
            else
              echo "结论：该 head 在 Linux 上测试通过。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-${{ strategy.job-index }}
          path: |
            test.txt
            vet.txt
